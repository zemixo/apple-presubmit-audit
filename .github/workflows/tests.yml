name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: >-
          python -m pip install -r requirements.txt
          "build>=1.2,<2" "twine>=6,<7"

      - name: Verify dependency environment
        run: python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m py_compile audit.py tests/test_audit.py
          tests/test_conditional_rules.py
          tests/test_github_action.py tests/test_packaging.py
          tests/verify_distribution.py tests/smoke_installed_cli.py

      - name: Build and inspect distribution archives
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir "$RUNNER_TEMP/dist"
          python -m twine check "$RUNNER_TEMP"/dist/*
          python tests/verify_distribution.py "$RUNNER_TEMP"/dist/*

      - name: Install and smoke-test wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          wheel_paths=("$RUNNER_TEMP"/dist/*.whl)
          sdist_paths=("$RUNNER_TEMP"/dist/*.tar.gz)
          test "${#wheel_paths[@]}" -eq 1
          test "${#sdist_paths[@]}" -eq 1

          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "${wheel_paths[0]}"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-venv/bin/python" \
            tests/smoke_installed_cli.py \
            "$GITHUB_WORKSPACE/rule-catalog.json" \
            "$GITHUB_WORKSPACE/tests/fixtures/github-action-project"

          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "${sdist_paths[0]}"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip check
          "$RUNNER_TEMP/sdist-venv/bin/python" \
            tests/smoke_installed_cli.py \
            "$GITHUB_WORKSPACE/rule-catalog.json" \
            "$GITHUB_WORKSPACE/tests/fixtures/github-action-project"

          mkdir "$RUNNER_TEMP/sdist-source"
          tar -xzf "${sdist_paths[0]}" -C "$RUNNER_TEMP/sdist-source"
          sdist_sources=("$RUNNER_TEMP"/sdist-source/apple_presubmit_audit-*)
          test "${#sdist_sources[@]}" -eq 1
          (
            cd "${sdist_sources[0]}"
            "$RUNNER_TEMP/sdist-venv/bin/python" \
              -m unittest discover -s tests -v
          )

  action-smoke:
    if: >-
      github.event_name == 'push' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the repository action
        id: audit
        uses: ./
        with:
          project_path: tests/fixtures/github-action-project
          python_version: "3.11"
          sarif_file: action-smoke.sarif
          category: action-smoke

      - name: Verify action outputs
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          SARIF_FILE: ${{ steps.audit.outputs.sarif_file }}
        run: |
          test "$AUDIT_EXIT_CODE" = "0"
          test "$SARIF_FILE" = "$RUNNER_TEMP/action-smoke.sarif"
          test -s "$SARIF_FILE"
          python - "$SARIF_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["version"] == "2.1.0"
          assert report["runs"][0]["tool"]["driver"]["name"] == "apple-presubmit-audit"
          assert report["runs"][0]["invocations"][0]["exitCode"] == 0
          PY
