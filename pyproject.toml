[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-presubmit-audit"
version = "0.6.0.dev0"
description = "Local App Store pre-submit audit for Apple platform projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zemixo"}]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
apple-presubmit-audit = "apple_presubmit_audit.audit:main"

[project.urls]
Homepage = "https://github.com/zemixo/apple-presubmit-audit"
Repository = "https://github.com/zemixo/apple-presubmit-audit"
Issues = "https://github.com/zemixo/apple-presubmit-audit/issues"

[tool.setuptools]
packages = ["apple_presubmit_audit"]
include-package-data = false

[tool.setuptools.package-dir]
apple_presubmit_audit = "."

[tool.setuptools.package-data]
apple_presubmit_audit = ["rule-catalog.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
